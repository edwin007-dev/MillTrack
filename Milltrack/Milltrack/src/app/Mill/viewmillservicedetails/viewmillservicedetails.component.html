<div class="card shadow-lg rounded-4 border-0">
    <div class="card-header bg-primary text-white text-center py-3 rounded-top">
      <h4 class="mb-0">Mill Service Details</h4>
    </div>
    <div class="card-body bg-light p-4">
      
      <!-- Category Dropdown -->
      <div class="mb-4">
        <label class="form-label fw-bold text-primary">Category</label>
        <select class="form-control form-control-lg" (change)="onCategorySelect($event)">
          <option value="" disabled selected>---Choose Category---</option>
          <option *ngFor="let cat of categoryArray" [value]="cat.category_id">
            {{ cat.categoryname }}
          </option>
        </select>
      </div>

      <!-- Service Table -->
      <div class="table-responsive" *ngIf="millServiceArray.length > 0">
        <table class="table table-hover table-bordered bg-white shadow-sm">
          <thead class="table-primary text-center">
            <tr>
              <th>Si No</th>
              <th>Subcategory Name</th>
              <th>Count</th>
              <th>Amount</th>
              <th>Edit</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody>
            <tr class="align-middle text-center" *ngFor="let service of millServiceArray; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ service.subcategoryname }}</td>
              <td>{{ service.count }}</td>
              <td>{{ service.amount }}</td>
              <td>
                <button class="btn btn-success btn-sm px-3">✏ Edit</button>
              </td>
              <td>
                <button class="btn btn-danger btn-sm px-3">🗑 Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
</div>
