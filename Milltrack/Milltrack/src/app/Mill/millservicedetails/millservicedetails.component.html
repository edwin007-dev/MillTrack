<div class="card shadow-lg rounded-4 border-0 overflow-hidden">
  <!-- Card Header -->
  <div class="card-header bg-gradient bg-primary text-white py-4 rounded-top">
    <div class="d-flex justify-content-between align-items-center">
      <h4 class="mb-0 fw-bold"> Add Mill Service Details</h4>
      <button class="btn btn-light btn-sm fw-bold shadow-sm px-3"  
        [routerLink]="['/millmaster/viewmillservicedetails']" 
        (click)="onView()"> View
      </button>
    </div>
  </div>

  <!-- Card Body -->
  <div class="card-body bg-light p-5">

    <form [formGroup]="millserviceformgroup" (ngSubmit)="OnSubmit()">
      
      <!-- Category Dropdown -->
      <div class="mb-4">
        <label class="form-label fw-bold text-primary"> Category</label>
        <select class="form-select form-select-lg shadow-sm border-2" formControlName="category_id" (change)="onCategoryChange()">
          <option value="" disabled selected>--- Choose a Category ---</option>
          <option *ngFor="let data of categoryarray" [value]="data.category_id">
            {{ data.categoryname }}
          </option>
        </select>
      </div>

      <!-- Subcategory Dropdown -->
      <div class="mb-4">
        <label class="form-label fw-bold text-primary"> Subcategory</label>
        <select class="form-select form-select-lg shadow-sm border-2" formControlName="subcat_id">
          <option value="" selected>--- Choose a Subcategory ---</option>
          <option *ngFor="let data of subcategoryarray" value="{{data.subcat_id}}">
            {{ data.subcatname }}
          </option>
        </select>
      </div>

      <!-- Amount Input -->
      <div class="mb-4">
        <label class="form-label fw-bold text-primary"> Amount</label>
        <input type="number" class="form-control form-control-lg shadow-sm border-2" formControlName="amount" placeholder="Enter Amount" />
      </div>

      <!-- Submit Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success btn-lg px-5 py-2 fw-bold shadow-sm">
           Save
        </button>
      </div>
      
    </form>
  </div>
</div>
