<div class="card shadow-lg rounded-4 border-0">
  <div class="card-header bg-primary text-white text-center py-3 rounded-top">
    <h4 class="mb-0">Mill Service View</h4>
  </div>
  <div class="card-body bg-light p-4">

      <div class="table-responsive">
        <table class="table table-hover table-bordered bg-white shadow-sm">
          <thead class="table-primary text-center">
            <tr>
              <th>Si No</th>
              <th>Category Image</th>
              <th>Category name</th>
             
              <th>Edit</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody>
            <tr class="align-middle text-center" *ngFor="let data of categorydataarray; let i = index">
              <td>{{ i + 1 }}</td>
            
              <td>
                <img style="width:70px; height:70px; border-radius:5px;"
                  [src]="'http://localhost:3000/images/' + data.image">
              </td>
              <td>{{ data.categoryname }}</td>
              
              <td>
                <a [routerLink]="['/millmaster/editlocation',data.location_id]"></a>
                <button class="btn btn-success btn-sm px-3"> Edit</button>
              </td>
              <td>
                <button class="btn btn-danger btn-sm px-3"> Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

  </div>
</div>
