<div class="container mt-4">
    <h2 class="text-center mb-4">Mill Service Categories</h2>
  
    <table class="table table-bordered table-hover mt-3">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Category Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of serviceCategories; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ category.categoryname }}</td>
          <td>
            <!-- Edit Button with Icon -->
            <button class="btn btn-primary btn-sm me-2">
                <button class="btn btn-success btn-sm px-3">✏ Edit</button>
            </button>
  
            <!-- Delete Button with Icon -->
            <button class="btn btn-danger btn-sm">
                <button class="btn btn-danger btn-sm px-3">🗑 Delete</button>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
