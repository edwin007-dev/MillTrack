<section class="vh-100 d-flex align-items-center justify-content-center bg-image" 
    style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="contact-form p-4 shadow-lg rounded bg-white">
                    <div class="heading_container d-flex justify-content-between align-items-center mb-4">
                        <h2 class="text-uppercase font-weight-bold text-primary mb-0">
                            Mill Category
                        </h2>
                        <button type="button" class="btn btn-outline-primary fw-bold" 
                            [routerLink]="['/millmaster/millserviceview']" (click)="onViewClick()">
                            View
                        </button>
                    </div>

    

                    <div class="form-group">
                        <label class="form-label fw-bold fs-5 d-block mb-2">Select the categories you want to provide</label>

                        <!-- Checkbox List -->
                        <div class="category-list">
                            <div class="form-check d-flex align-items-center py-2 px-3 rounded shadow-sm bg-light"
                                 *ngFor="let data of categoryarray; let i = index">
                                <input type="checkbox" class="form-check-input big-checkbox me-3"
                                    (change)="onCategoryChange($event, data.category_id)"
                                    [value]="data.category_id"
                                    id="category{{ i }}" />
                                <label class="form-check-label fs-5 text-dark" for="category{{ i }}">
                                    {{ data.categoryname }}
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="btn-box text-center mt-4">
                        <button type="button" (click)="OnSubmit()" 
                            class="btn btn-lg btn-primary px-5 py-2 fw-bold shadow">
                            Submit
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
