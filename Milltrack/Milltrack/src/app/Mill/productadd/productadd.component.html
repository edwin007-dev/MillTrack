<section class="vh-100 bg-image" style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask gradient-custom-3 d-flex align-items-center justify-content-center" style="width: 100%; height: 100%;">
    <div class="container d-flex justify-content-center align-items-center" style="height: 100%;">
      <div class="row w-100 d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
          <div class="card" style="border-radius: 15px; width: 100%; min-height: 40vh; margin-top: 0.5cm; margin-bottom: 0.5cm;">
            <div class="card-body p-5">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-uppercase text-center m-0">Product Page</h2>
                <button class="btn btn-primary btn-sm"  [routerLink]="['/millmaster/productaddview'] " (click)="onView()">View</button>
              </div>

              <form [formGroup]="productaddform" enctype="multipart/form-data">
                <div class="row">
                  <!-- Category Dropdown -->
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-control" formControlName="category_id" (change)="getcategorybyid()">
                      <option value="">---Choose category---</option>
                      <option *ngFor="let data of categorydata" value="{{data.category_id}}">{{ data.categoryname }}</option>
                    </select>
                  </div>
                 
                  <!-- <div class="col-md-6 mb-3">
                    <label class="form-label">Sub Category</label>
                    <select class="form-control" formControlName="subcat_id">
                      <option value="">---Choose subcategory---</option>
                      <option *ngFor="let data of subcategorydata" value="{{data.subcat_id}}">{{ data.subcatname }}</option>
                    </select>
                  </div> -->
                </div>
                <div class="row">
                  <!-- Product Name -->
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" formControlName="productname" />
                  </div>
                  <!-- Image Upload -->
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Image</label>
                    <input type="file" class="form-control" formControlName="image" (change)="selectFile($event)" />
                  </div>
                </div>
                <div class="row">
                  <!-- Price -->
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" class="form-control" formControlName="price" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" formControlName="stock" step="any" min="0" />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" formControlName="quantity"  />
                  </div>
                  <div class="form-group quantity-box">
                    <label class="control-label">Unit</label>
                    <select class="form-control" formControlName="unit" (change)="calculateTotalAmount()">
                        <option value="kilo">Kilo</option>
          
                        <option value="litre">Litre</option>
                    </select>
                </div>
                </div>
                <div class="row">
                  <!-- Description -->
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-control" formControlName="description" />
                  </div>
                  <!-- Quantity -->
                  <!-- <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" formControlName="quantity" />
                  </div> -->
                </div>
                <!-- Submit Button -->
                <div class="d-flex justify-content-center mt-4">
                  <button type="submit" class="btn btn-success btn-lg gradient-custom-4 text-body" (click)="onSubmit()">Submit</button>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
