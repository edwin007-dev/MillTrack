<div class="card">
  <div class="card-header">
    <div class="card-title">Service Booking View</div>
  </div>
  <div class="card-body">

    <div class="card-sub">
      <code class="highlighter-rouge"></code> 
    </div>
    
     <form>
     
        <!-- Table starts here -->
        <table class="table table-striped mt-3">
          <thead>
            <tr>
              <th scope="col">Si No</th>
              <th scope="col">Customer name</th>
              <th scope="col">subcat Name</th>
              <th scope="col">Image</th>
              <th scope="col">Quantity</th>
              <th scope="col">Unit</th>
              <th scope="col">Amount</th>
              <!-- <th scope="col">Status</th> -->
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let data of viewbookingarray, let i = index">
              <td>{{i + 1}}</td>
              <td>{{data.name}}</td>
              <td>{{data.subcatname}}</td>
              <td class="text-danger"><img style="width:70px;height:70px;"
                src="http://localhost:3000/images/{{data.image}}">
              <td>{{data.quantity}}</td>
    
              <td>{{data.unit}}</td>
              <td>{{data.amount}}</td>
              <!-- <td>{{data.status}}</td> -->
              <td>
                <button 
  [routerLink]="['/customermaster/payment', data.bookingdetails_id, data.customer_id]" 
  class="btn btn-success" 
  [ngClass]="{'disabled-button': data.bookingstatus === 'Rejected'}" 
  [disabled]="data.bookingstatus === 'Rejected'">
  Pay Now
</button>
                  </td>
               
            
                <!-- <div class="d-flex justify-content-start pt-3">
                  <a><button class="btn btn-primary" (click)="bookingreject(data.bookingdetails_id)">Reject</button></a>
                </div> -->
              
            </tr>
          </tbody>
        </table>
    </form> 
  </div>
