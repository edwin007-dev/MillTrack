<div class="shop-detail-box-main">
    <div class="container">
        <div class="row">
            <!-- Product Image Section -->
            <div class="col-xl-5 col-lg-5 col-md-6">
                <div id="carousel-example-1" class="single-product-slider carousel slide" data-ride="carousel">
                    <div class="carousel-inner" role="listbox">
                        <div class="carousel-item active">
                            <img class="d-block w-100"
                                [src]="imageService.getUrl(productdataarray[0].image)"
                                alt="Product Image"
                                style="height: 500px;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product Details Section -->
            <div class="col-xl-7 col-lg-7 col-md-6">
                <form [formGroup]="productsingleviewgroup">
                    <div class="single-product-details">
                        <h2>{{ productdataarray[0].productname }}</h2>
                        <h5>&#8377; {{ productdataarray[0].price }}</h5>
                        <p class="available-stock">
                            <span> More than 20 available / <a href="#">10 sold</a></span>
                        </p>

                        <h4>Short Description:</h4>
                        <p>{{ productdataarray[0].description }}</p>

                        <ul>
                            <li>
                                <!-- Quantity Input -->
                                <div class="form-group quantity-box">
                                    <label class="control-label">Quantity</label>
                                    <input class="form-control" formControlName="quantity" min="0" max="20" 
                                        type="number" (input)="calculateTotalAmount()">
                                </div>

                                <!-- Unit Selection Dropdown -->
                                <div class="form-group quantity-box">
                                    <label class="control-label">Unit</label>
                                    <select class="form-control" formControlName="unit" (change)="calculateTotalAmount()">
                                        <option value="kilo">Kilo</option>
                                        <option value="litre">Litre</option>
                                    </select>
                                </div>

                                <!-- Amount Display -->
                                <div class="form-group quantity-box">
                                    <label class="control-label">Total Amount</label>
                                    <input class="form-control" formControlName="amount" type="number" readonly
                                        style="margin-left: 12px;">
                                </div>
                            </li>
                        </ul>

                        <!-- Booking Button -->
                        <div class="price-box-bar">
                            <div class="cart-and-bay-btn d-flex justify-content-between">
                                <button class="btn hvr-hover" (click)="bookNow()">Add to cart</button>
                                <!-- <button class="btn hvr-hover" (click)="bookNow()">Finish</button> -->
                            </div>
                        </div>
                        

                        <!-- Social Media Share Buttons -->
                        <div class="add-to-btn">
                            <div class="share-bar">
                                <a class="btn hvr-hover" href="#"><i class="fab fa-facebook"></i></a>
                                <a class="btn hvr-hover" href="#"><i class="fab fa-google-plus"></i></a>
                                <a class="btn hvr-hover" href="#"><i class="fab fa-twitter"></i></a>
                                <a class="btn hvr-hover" href="#"><i class="fab fa-pinterest-p"></i></a>
                                <a class="btn hvr-hover" href="#"><i class="fab fa-whatsapp"></i></a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
