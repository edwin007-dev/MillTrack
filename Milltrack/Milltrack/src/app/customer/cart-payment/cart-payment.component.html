<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .payment-card {
      background-color: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .payment-card h4 {
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
      color: #333;
    }

    .form-label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
    }

    .btn-pay {
      background-color: #28a745;
      color: white;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      width: 100%;
      transition: background 0.3s ease;
      margin-top: 20px;
    }

    .btn-pay:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="payment-card">
  <h4>Secure Payment</h4>
  
  <form>
    <div class="mb-3">
      <label for="cardNumber" class="form-label">Card Number</label>
      <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required />
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="expiry" class="form-label">Expiry Date</label>
        <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required />
      </div>
      <div class="col-md-6">
        <label for="cvv" class="form-label">CVV</label>
        <input type="password" id="cvv" class="form-control" placeholder="123" required />
      </div>
    </div>

    <button type="button" class="btn btn-pay" (click)="Onsubmit()">PAY ₹{{ carttotal[0]?.totalamount || '0.00' }}</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
