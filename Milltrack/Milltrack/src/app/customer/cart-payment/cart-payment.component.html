<div class="payment-page-wrapper py-5">
  <div class="container">
    <!-- Page Header -->
    <div class="row justify-content-center mb-4">
      <div class="col-lg-8 text-center">
        <h2 class="page-title text-uppercase fw-bold mb-2">Cart Checkout</h2>
        <p class="text-muted mb-0">Complete your retail order payment securely</p>
        <div class="header-divider mx-auto mt-2"></div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card payment-card shadow-sm border-0">
          <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark">
              <i class="fa fa-lock text-success me-2"></i> Payment Details
            </h5>
            <div class="payment-badges d-flex align-items-center gap-2">
              <span class="badge bg-light text-dark border">VISA</span>
              <span class="badge bg-light text-dark border">Mastercard</span>
              <span class="badge bg-light text-dark border">RuPay</span>
            </div>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="mb-3">
                <label for="cardNumber" class="form-label fw-semibold text-secondary">Card Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fa fa-credit-card text-muted"></i></span>
                  <input type="text" id="cardNumber" class="form-control border-start-0" placeholder="1234 5678 9012 3456" required />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label for="expiry" class="form-label fw-semibold text-secondary">Expiry Date</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-calendar text-muted"></i></span>
                    <input type="text" id="expiry" class="form-control border-start-0" placeholder="MM/YY" required />
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="cvv" class="form-label fw-semibold text-secondary">CVV</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-muted"></i></span>
                    <input type="password" id="cvv" class="form-control border-start-0" placeholder="•••" required />
                  </div>
                </div>
              </div>

              <!-- Security Note -->
              <div class="alert alert-light border d-flex align-items-center mb-4 py-2 px-3 text-muted small">
                <i class="fa fa-shield fa-2x text-success me-3"></i>
                <div>
                  <strong class="text-dark d-block">Guaranteed 256-Bit SSL Encryption</strong>
                  Your personal and payment credentials are processed securely.
                </div>
              </div>

              <button type="button" class="btn btn-pay-now w-100 py-3 fw-bold" (click)="Onsubmit()">
                <i class="fa fa-lock me-2"></i> Pay ₹{{ carttotal[0]?.totalamount || '0.00' }} Securely
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
