<section class="vh-100 bg-image"
  style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask d-flex align-items-center h-100 gradient-custom-3">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-6">
          <div class="card" style="border-radius: 15px;">
            <div class="card-body p-5">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-uppercase">Location Registration</h2>
                <button type="button" class="btn btn-info btn-sm" style="margin-top: -0.5cm;" [routerLink]="['/adminmaster/locationview'] ">View</button>
              </div>

              <form [formGroup]="locationformgroup">

                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label" for="form3Example3cg">District</label>
                  <select class="form-control" formControlName="district_id">
                    <option value="">---Choose District---</option>
                    <option *ngFor="let data of districtdataarray"
                      value="{{data.district_id}}">{{ data.districtname }}</option>
                  </select>
                  <div *ngIf="locationformgroup.controls['district_id'].invalid && (locationformgroup.controls['district_id'].dirty || locationformgroup.controls['District_id'].touched) || validationstatus">
                    <div *ngIf="locationformgroup.controls['district_id'].errors?.['required'] " style="color: red;">
                     *Required.
                    </div>
       </div>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label" for="form3Example1cg">Location</label>
                  <input type="text" id="form3Example1cg" class="form-control form-control-lg" formControlName="locationname"/>
                  <div *ngIf="locationformgroup.controls['locationname'].invalid && (locationformgroup.controls['locationname'].dirty || locationformgroup.controls['locationname'].touched) || validationstatus">
                    <div *ngIf="locationformgroup.controls['locationname'].errors?.['required'] " style="color: red;">
                     *Required.
                    </div>
        </div>
                </div>
              

                <div class="d-flex justify-content-center">
                  <button type="button" data-mdb-button-init
                    data-mdb-ripple-init class="btn btn-success btn-block btn-lg gradient-custom-4 text-body" (click)="Onsubmit()">Register</button>
                </div>

              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
