<section class="vh-100 bg-image"
  style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask gradient-custom-3 d-flex align-items-center justify-content-center" style="width: 100%; height: 100%;">
    <div class="container d-flex justify-content-center align-items-center" style="height: 100%;">
      <div class="row w-100 d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
          <!-- Further decreased the min-height to make the form even shorter -->
          <div class="card" style="border-radius: 15px; width: 100%; min-height: 30vh; margin-top: 1cm;">
            <div class="card-body p-5">
              <h2 class="text-uppercase">Subcategory Registration</h2>
              
              <!-- View Button positioned below with adjusted margin -->
              <button type="button" class="btn btn-info btn-sm" 
                      style="margin-top: 0.3cm;" [routerLink]="['/adminmaster/subcategoryview']">View</button>

              <form [formGroup]="SubcategoryForm" enctype="multipart/form-data">
                <!-- Category Dropdown -->
                <div class="form-outline mb-3">
                  <label class="form-label" for="form3Example3cg">Category</label>
                  <select class="form-control form-control-lg" formControlName="category_id">
                    <option value="">---Choose category---</option>
                    <option *ngFor="let data of categorydata" value="{{data.category_id}}">
                      {{ data.categoryname }}
                    </option>
                  </select>
                  <div *ngIf="SubcategoryForm.controls['category_id'].errors?.['required'] " style="color: red;">
                    *Required.
                   </div>
                </div>

                <!-- Subcategory Name Field -->
                <div class="form-outline mb-3">
                  <label class="form-label" for="form3Example1cg">Subcategory Name</label>
                  <input type="text" id="form3Example1cg" class="form-control form-control-lg" 
                         formControlName="subcatname" />
                         <div *ngIf="SubcategoryForm.controls['subcatname'].errors?.['required'] " style="color: red;">
                          *Required.
                         </div>
                </div>

                <!-- Image Upload Field -->
                <div class="form-outline mb-3">
                  <label class="form-label" for="exampleInputUsername2">Image</label>
                  <input type="file" formControlName="image" (change)="selectFile($event)" 
                         class="form-control form-control-lg" id="exampleInputUsername2" />
                         <div *ngIf="SubcategoryForm.controls['image'].invalid && (SubcategoryForm.controls['image'].dirty || SubcategoryForm.controls['image'].touched) || validationstatus">
                          <div *ngIf="SubcategoryForm.controls['image'].errors?.['required'] " style="color: red;">
                              *Required.
                          </div>
                      </div>
                </div>

                <!-- Description Field -->
                <div class="form-outline mb-3">
                  <label class="form-label" for="form3Example2cg">Description</label>
                  <input type="text" id="form3Example2cg" class="form-control form-control-lg" 
                         formControlName="description" />
                         <div *ngIf="SubcategoryForm.controls['description'].errors?.['required'] " style="color: red;">
                          *Required.
                         </div>
                </div>

                <!-- Register Button -->
                <div class="d-flex justify-content-center mt-4">
                  <button type="button" data-mdb-button-init data-mdb-ripple-init
                    class="btn btn-success btn-lg gradient-custom-4 text-body" 
                    (click)="onSubmit()">Register</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
