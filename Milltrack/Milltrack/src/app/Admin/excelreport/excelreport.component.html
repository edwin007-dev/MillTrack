<div class="midde_cont">
    <div class="container-fluid">
      <div class="row column_title">
        <div class="col-md-12">
          <div class="page_title">
            <!-- <h2>Project</h2> -->
          </div>
        </div>
      </div>
  
      <!-- row -->
      <div class="row column1">
        <div class="col-md-12">
          <div class="white_shd full margin_bottom_30">
            <div class="full graph_head">
              <div class="heading1 margin_0">
                <h2>Product Details<small></small></h2>
              </div>
            </div>
  
            <div class="full price_table padding_infor_info">
              <div class="row">
                <div class="col-md-12">
                    <div style="margin-top: .5in;">
                  <div class="table-responsive-sm" #TABLE #table>
                    <table class="table table-striped projects">
                      <thead class="thead-dark">
                        <tr>
                          <th style="width: 2%">No</th>
                          <th>Product Name</th>
                          <th>Description</th>
                          <th>Category</th>
                          <!-- <th>Action</th> -->
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let data of Registrationdata; let i = index">
                          <td><a>{{i+1}}</a></td>
                          <td>{{data.productname}}</td>
                          <td>{{data.description}}</td>
                          <td>{{data.categoryname}}</td>
                          <!-- <td>
                            <a [routerLink]="['/AdminMaster/productedit',data.productid]">
                              <button class="btn btnsuccess">Edit</button>
                            </a>
                            <button class="btn btn-danger" (click)="Deleteproductdata(data.productid)">Delete</button>
                          </td> -->
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
  
              <!-- Button moved to bottom right -->
              <div class="row mt-3">
                <div class="col-md-12 text-end">
                  <button (click)="ExportTOExcel()" class="btn" style="background-color: #5bc0de; color: white;">
                    Export To Excel
                  </button>
                </div>
              </div>
              
  
            </div>
          </div>
        </div>
      </div>
      <!-- end row -->
    </div>
  </div>
