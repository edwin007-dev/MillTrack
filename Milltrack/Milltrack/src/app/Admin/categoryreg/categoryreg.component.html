<section class="vh-100 bg-image"
  style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask d-flex align-items-center h-100 gradient-custom-3">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-6">
          <div class="card" style="border-radius: 15px;">
            <div class="card-body p-5">
              <!-- Heading with View Button -->
              <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="text-uppercase">Category Registration</h2>
                <button type="button" class="btn btn-info btn-sm" [routerLink]="['/adminmaster/categoryview'] ">View</button>
              </div>

              <form [formGroup]="categoryForm" enctype="multipart/form-data">
                <!-- Category Name Field -->
                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label" for="form3Example1cg">Category Name</label>
                  <input type="text" id="form3Example1cg" 
                         class="form-control form-control-lg" 
                         formControlName="categoryname" />
                         <div *ngIf="categoryForm.controls['categoryname'].errors?.['required'] " style="color: red;">
                          *Required.
                         </div>
                </div>

                <!-- Image Upload Field -->
                <div class="form-outline mb-4">
                  <label class="form-label" for="exampleInputUsername2">Image</label>
                  <input type="file" formControlName="image" 
                         (change)="selectFile($event)" 
                         class="form-control form-control-lg" 
                         id="exampleInputUsername2" />
                         <div *ngIf="categoryForm.controls['image'].invalid && (categoryForm.controls['image'].dirty || categoryForm.controls['image'].touched) || validationstatus">
                          <div *ngIf="categoryForm.controls['image'].errors?.['required'] " style="color: red;">
                              *Required.
                          </div>
            </div>
                </div>

                <!-- Register Button -->
                <div class="d-flex justify-content-center mt-5">
                  <button type="button" data-mdb-button-init data-mdb-ripple-init
                    class="btn btn-success btn-lg gradient-custom-4 text-body" 
                    (click)="onSubmit()">Register</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
