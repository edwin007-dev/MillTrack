<section class="registration-section">
  <div class="registration-container">
    <div class="registration-card">
      <h3 class="registration-title">Mill Registration</h3>
      <form [formGroup]="millgroup">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="millName">Mill Name</label>
              <input type="text" id="millName" placeholder="Enter Mill Name" formControlName="name">
              <div *ngIf="(millgroup.controls['name'].touched || millgroup.controls['name'].dirty || savestatus) && millgroup.controls['name'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="license">License Number</label>
              <input type="tel" id="license" placeholder="Enter License Number" formControlName="license" maxlength="12">
              <div *ngIf="(millgroup.controls['license'].touched || millgroup.controls['license'].dirty || savestatus) && millgroup.controls['license'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="phoneNumber">Phone Number</label>
              <input type="tel" id="phoneNumber" placeholder="Enter Phone Number" formControlName="phone" maxlength="10">
              <div *ngIf="(millgroup.controls['phone'].touched || millgroup.controls['phone'].dirty || savestatus) && millgroup.controls['phone'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Enter Email" formControlName="email">
              <div *ngIf="(millgroup.controls['email'].touched || millgroup.controls['email'].dirty || savestatus) && millgroup.controls['email'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="district">District</label>
              <select id="district" formControlName="district_id" (change)="getlocationbyid()">
                <option value="">-- Select District --</option>
                <option *ngFor="let data of districtdata" [value]="data.district_id">{{data.districtname}}</option>
              </select>
              <div *ngIf="(millgroup.controls['district_id'].touched || millgroup.controls['district_id'].dirty || savestatus) && millgroup.controls['district_id'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="location">Location</label>
              <select id="location" formControlName="location_id">
                <option value="">-- Select Location --</option>
                <option *ngFor="let data of locationdata" [value]="data.location_id">{{data.locationname}}</option>
              </select>
              <div *ngIf="(millgroup.controls['location_id'].touched || millgroup.controls['location_id'].dirty || savestatus) && millgroup.controls['location_id'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label for="landmark">Landmark</label>
              <input type="text" id="landmark" placeholder="Enter Landmark" formControlName="landmark">
              <div *ngIf="(millgroup.controls['landmark'].touched || millgroup.controls['landmark'].dirty || savestatus) && millgroup.controls['landmark'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="pincode">Pincode</label>
              <input type="text" id="pincode" placeholder="Enter Pincode" formControlName="pincode" maxlength="6">
              <div *ngIf="(millgroup.controls['pincode'].touched || millgroup.controls['pincode'].dirty || savestatus) && millgroup.controls['pincode'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="imageUpload">Image</label>
              <input type="file" formControlName="image" (change)="selectFile($event)" class="form-control" id="imageUpload">
              <div *ngIf="(millgroup.controls['image'].touched || millgroup.controls['image'].dirty || savestatus) && millgroup.controls['image'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" placeholder="Enter Username" formControlName="username">
              <div *ngIf="(millgroup.controls['username'].touched || millgroup.controls['username'].dirty || savestatus) && millgroup.controls['username'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter Password" formControlName="password">
              <div *ngIf="(millgroup.controls['password'].touched || millgroup.controls['password'].dirty || savestatus) && millgroup.controls['password'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn" (click)="Onsubmit()">Submit</button>
      </form>
    </div>
  </div>
</section>
