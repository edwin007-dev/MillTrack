<section class="registration-section">
  <div class="registration-container">
    <div class="registration-card">
      <h3 class="registration-title">Customer Registration</h3>
      <form [formGroup]="customergroup">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="custName">Name</label>
              <input type="text" id="custName" placeholder="Enter Name" formControlName="name">
              <div *ngIf="(customergroup.controls['name'].touched || customergroup.controls['name'].dirty || savestatus) && customergroup.controls['name'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="phoneNumber">Phone Number</label>
              <input type="tel" id="phoneNumber" placeholder="Enter Phone Number" formControlName="phone" maxlength="10">
              <div *ngIf="(customergroup.controls['phone'].touched || customergroup.controls['phone'].dirty || savestatus) && customergroup.controls['phone'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Enter Email" formControlName="email">
              <div *ngIf="(customergroup.controls['email'].touched || customergroup.controls['email'].dirty || savestatus) && customergroup.controls['email'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="pincode">Pincode</label>
              <input type="text" id="pincode" placeholder="Enter Pincode" formControlName="pincode" maxlength="6">
              <div *ngIf="(customergroup.controls['pincode'].touched || customergroup.controls['pincode'].dirty || savestatus) && customergroup.controls['pincode'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="district">District</label>
              <select id="district" formControlName="district_id" (change)="getlocationbyid()">
                <option value="">-- Select District --</option>
                <option *ngFor="let data of districtdata" [value]="data.district_id">{{data.districtname}}</option>
              </select>
              <div *ngIf="(customergroup.controls['district_id'].touched || customergroup.controls['district_id'].dirty || validationstatus || savestatus) && customergroup.controls['district_id'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="location">Location</label>
              <select id="location" formControlName="location_id">
                <option value="">-- Select Location --</option>
                <option *ngFor="let data of locationdata" [value]="data.location_id">{{data.locationname}}</option>
              </select>
              <div *ngIf="(customergroup.controls['location_id'].touched || customergroup.controls['location_id'].dirty || validationstatus || savestatus) && customergroup.controls['location_id'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" placeholder="Enter Username" formControlName="username">
              <div *ngIf="(customergroup.controls['username'].touched || customergroup.controls['username'].dirty || savestatus) && customergroup.controls['username'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter Password" formControlName="password">
              <div *ngIf="(customergroup.controls['password'].touched || customergroup.controls['password'].dirty || savestatus) && customergroup.controls['password'].errors?.['required']" class="error-text">
                *Required.
              </div>
            </div>
          </div>
        </div>

        <button type="submit" (click)="Onsubmit()" class="submit-btn">Submit</button>
      </form>
    </div>
  </div>
</section>
